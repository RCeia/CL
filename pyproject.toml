[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "klkg"
version = "0.1.0"
description = "Enriching a Movie Knowledge Graph with LLM-Extracted Plot Facts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests==2.34.2",
  "python-dotenv==1.2.4",
  "pyyaml==6.0.3",
  "rdflib==7.2.1",
  "pyshacl==0.31.0",
  "morph-kgc==2.10.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
llm = ["vllm==0.33.0"]

# Each pipeline step is a folder in src/ (p1_... to p9_..., shared code in p0_commons) and its files are run
# directly, e.g. `python src/p6_extraction/run_extraction.py`. Installing with `pip install -e .` makes the
# folders importable from each other; there are no generated command shortcuts.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
